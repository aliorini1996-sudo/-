ShortDescription: نظام إدارة المبيعات الميدانية والتوزيع، عربيّ أولاً، لويندوز.
Description: >-
  فيلد سيلز منصّة لإدارة المبيعات الميدانية والتوزيع مبنيّة بالعربية أولاً للسعودية والخليج.
  يُصدر المندوب فاتورة ضريبية من جواله دون اتصال بالإنترنت، وتُطابَق عهدة السيارة بالصنف مقابل
  التحميل الصباحي، وتُثبَت الزيارة بالموقع والصورة، ويُسجَّل التحصيل على فواتير بعينها.
  وهذا تطبيق ويندوز للوحة إدارة الشركة: العملاء والمناديب والأصناف والطلبات والسندات والتقارير
  اللحظية. الاشتراك لكل شركة لا لكل مستخدم.
