ShortDescription: Arabic-first field sales and distribution management for Windows.
Description: >-
  FieldSales is a field sales and distribution (van sales / DSD) platform built Arabic-first for Saudi Arabia and the Gulf. Reps issue tax invoices from a phone with no connection at all, van stock is reconciled by item against the morning load, visits are proven by location and photo, and collections are recorded against specific invoices. This Windows app is the company admin console: customers, reps, catalogue, orders, receipts and live reports. Subscription is per company rather than per user.
