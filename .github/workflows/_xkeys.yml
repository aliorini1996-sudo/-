name: نقل مفاتيح X إلى البوت
on: { workflow_dispatch: }
jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: انقل بلا طباعة
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          SVC = 'srv-da6lcu942hec73di3hng'
          rk = os.environ['RENDER_API_KEY']
          for k in ['X_API_KEY','X_API_SECRET','X_ACCESS_TOKEN','X_ACCESS_SECRET']:
              v = os.environ.get(k, '')
              if not v:
                  print(f'{k}: مفقود'); continue
              req = urllib.request.Request(
                  f'https://api.render.com/v1/services/{SVC}/env-vars/{k}',
                  data=json.dumps({'value': v}).encode(), method='PUT',
                  headers={'Authorization': f'Bearer {rk}', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(f'{k}: {r.status} (طول {len(v)})')   # الطول فقط، لا القيمة
              except Exception as e:
                  print(f'{k}: فشل {e}')
          PY
