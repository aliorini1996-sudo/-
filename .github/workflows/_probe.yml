name: فحص قدرات المنصّات
on: { workflow_dispatch: }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests requests_oauthlib
      - name: احذف الردّ التجريبي
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: |
          python - <<'PY'
          import os, requests
          from requests_oauthlib import OAuth1
          auth = OAuth1(os.environ['X_API_KEY'], os.environ['X_API_SECRET'],
                        os.environ['X_ACCESS_TOKEN'], os.environ['X_ACCESS_SECRET'])
          d = requests.delete('https://api.x.com/2/tweets/2092496688556695953', auth=auth, timeout=30)
          print('delete ->', d.status_code, d.text[:200])
          PY
