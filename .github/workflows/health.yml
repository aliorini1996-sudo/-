name: نبضة الصحة والدخان

# عين النظام — بدل أن يكون المالك هو العين.
#
# وجدت دراسة الأتمتة أن اكتشاف الخلل بعد النشر يقع بالصدفة أو بشكوى عميل
# (٢٤٠ دقيقة/شهر)، والتحقق من وصول النشر يدوي بالمتصفح (١٨٠+٤٠)، ولا مراقب
# توافر إطلاقا (٩٠). هذا الملف يحذف البنود الأربعة معا.
#
# مبادئ حاكمة:
#  • يعمل على GitHub لا على Render — المراقب لا يموت مع المراقب.
#  • التنبيه على **تغير الحالة** لا على الحالة: عطل جديد = فتح Issue (وGitHub
#    يبرد المالك تلقائيا)، والتعافي = تعليق وإغلاق. لا عاصفة تنبيهات: العطل
#    المستمر لا يكرر البريد لأن الـIssue مفتوحة سلفا — هي نفسها ذاكرة الحالة،
#    فلا cache ولا ملف حالة يمكن أن يضيع.
#  • البوت على خطة تنيم الخدمة — مهلة ٩٠ ثانية تسمح بإيقاظه، والنبضة نفسها
#    تبقيه مستيقظا (تعويض جزئي عن فجوات keepalive الموثقة).

on:
  schedule:
    - cron: '*/10 * * * *'   # كل ١٠ دقائق
    - cron: '5 5 * * *'      # ٥:٠٥ UTC = ٨:٠٥ص الرياض: فرز إخفاقات الأمس
    - cron: '15 5 * * *'     # ٥:١٥ UTC = ٨:١٥ص الرياض: شبكة أمان التقارير
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: health-pulse
  cancel-in-progress: false

jobs:
  # شبكة أمان التقارير: الجدولة الداخلية setInterval تموت مع العملية —
  # نشرةٌ داخل ساعة الثامنة كانت تُسقط تقرير الشهر بلا تعويض ولا إنذار.
  # التبريد في القاعدة (OpsMarker) فالنداء الخارجي لا يكرّر ما أرسلته النبضة
  # الداخلية — الإنشاء الفريد هو القفل.
  reports-safety-net:
    if: github.event.schedule == '15 5 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: اضمن تقارير اليوم
        env:
          OPS_TOKEN: ${{ secrets.WA_SWEEP_TOKEN }}
        run: |
          [ -n "$OPS_TOKEN" ] || { echo "::error::WA_SWEEP_TOKEN غير مضبوط"; exit 1; }
          code=$(curl -s -o /tmp/r.json -w '%{http_code}' -X POST --max-time 120 \
            -H "x-ops-token: $OPS_TOKEN" \
            https://dsd-backend.onrender.com/api/ops/run-reports)
          echo "الرد: $code"; cat /tmp/r.json || true
          [ "$code" = "200" ] || { echo "::error::شبكة أمان التقارير فشلت"; exit 1; }

  pulse:
    if: github.event.schedule == '*/10 * * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          # التاريخ كاملاً: مقارنة النشر تسأل «آخر كوميت مسّ backend» وهو سؤالٌ
          # عن التاريخ. بعمق ١ يرى git الكوميت الأخير وحده فيُرجع فراغاً أو HEAD.
          fetch-depth: 0

      - name: افحص الأهداف الثلاثة والدخان
        id: checks
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          OPS_TOKEN: ${{ secrets.WA_SWEEP_TOKEN }}
        run: |
          fails=""
          note() { fails="${fails}${1}\n"; echo "::warning::$1"; }

          # ٠) سعة قاعدة البيانات — الرقم الذي يسبق الانهيار.
          #
          # الخادم يعمل عند ٠٫٤٪ من طاقته بينما ذاكرة القاعدة عند ثلثيها، فالعنق
          # الضيّق هناك. والقياس يُدفع أيضاً للوحة المالك كي يراه قبل أن نُنبّه.
          #
          # المفتاح هنا لا في الباكند عمداً: مفتاح Render يملك الحساب كلّه، فوضعه
          # في خدمة مكشوفة للإنترنت يجعل اختراقها اختراقاً للحساب بأسره.
          #
          # ولا يُكتب سقفٌ هنا إطلاقاً — كلّها تُقرأ من Render. كان سقف الذاكرة
          # مكتوباً (٢٥٦ ميغابايت)، فلمّا رقّى المالك الخطّة إلى ١ غيغابايت بقيت
          # القسمة على الرقم القديم فأعلنت اللوحة «الذاكرة ١٣٥٪ — رقِّ الخطة» عن
          # خطّةٍ رُقّيت للتوّ (٢٣ سبتمبر): إنذارٌ كاذب يدفع إلى صرفٍ لا داعي له،
          # وأسوأ منه أنّه يُفقد الثقة بالمؤشّر كلّه. ولـRender مقاييسُ للسقوف
          # نفسها تتبع الخطّة لحظةً بلحظة: memory-limit وconnections-limit
          # وdisk-capacity — فلا يبقى رقمٌ يشيخ بصمت.
          if [ -n "$RENDER_API_KEY" ]; then
            DB_ID=dpg-d8rp9dho3t8c73ecg2r0-a
            rmetric() {
              curl -s --max-time 30 -H "Authorization: Bearer $RENDER_API_KEY" \
                "https://api.render.com/v1/metrics/$1?resource=$DB_ID&resolutionSeconds=3600" \
                | grep -oE '"value":[0-9.]+' | tail -1 | cut -d: -f2
            }
            # فراغٌ أو صفر = «لم يُقَس» لا «السقف صفر»: القسمة على صفر تُنتج قيمة
            # لا معنى لها تُعرض في اللوحة كأنّها قياس
            num() { case "$1" in ''|0|0.0) echo "" ;; *) echo "$1" ;; esac; }
            mem=$(rmetric memory);             mem_limit=$(num "$(rmetric memory-limit)")
            con=$(rmetric active-connections); con_limit=$(num "$(rmetric connections-limit)")
            disk=$(rmetric disk-usage);        disk_limit=$(num "$(rmetric disk-capacity)")
            mib() { awk -v b="$1" 'BEGIN{printf "%.0f", b/1048576}'; }
            gbd() { awk -v b="$1" 'BEGIN{printf "%.1f", b/1000000000}'; }

            if [ -n "$mem" ] && [ -n "$mem_limit" ]; then
              pct=$(awk -v m="$mem" -v l="$mem_limit" 'BEGIN{printf "%.0f", (m/l)*100}')
              echo "ذاكرة القاعدة: ${pct}% من $(mib "$mem_limit") ميغابايت · الاتصالات: ${con:-؟}/${con_limit:-؟}"
              # التنبيه عند ٨٠٪: يترك مهلة للترقية قبل أن يشعر عميل بشيء
              [ "$pct" -ge 80 ] && note "ذاكرة قاعدة البيانات ${pct}% من $(mib "$mem_limit") ميغابايت — رقِّ الخطة قبل أن تمتلئ"
            else
              note "تعذّر قياس ذاكرة قاعدة البيانات أو سقفها من Render"
            fi
            # نسبةً لا عدداً: «٧٠ اتصالاً» تنبيهٌ صحيح على سقف ١٠٠ وضجيجٌ على سقفٍ
            # أكبر — والسقف يتغيّر بالخطّة
            if [ -n "$con" ] && [ -n "$con_limit" ]; then
              cpct=$(awk -v c="$con" -v l="$con_limit" 'BEGIN{printf "%.0f", (c/l)*100}')
              [ "$cpct" -ge 70 ] && note "اتصالات القاعدة ${con} من ${con_limit} (${cpct}%) — راجع حوض Prisma"
            fi

            # مساحة التخزين — كادت تُعلِّق القاعدة (١٦ سبتمبر) بلا تنبيه منّا: كنّا
            # نقيس الذاكرة وحدها، والإنذار الذي أنقذ الموقف جاء من بريد Render.
            #
            # والسعة من مقياس disk-capacity لا من diskSizeGB×10⁹: القرص المهيّأ أكبر
            # قليلاً من المطلوب (٥ GB ⇒ ٥٫٢٥)، والزيادة التلقائية تغيّره بلا علمنا.
            # وهي عشريّة لا ثنائيّة: ٨٦٢ MiB ÷ 10^9 = ٩٠٫٤٪ وهو ما أرسله Render،
            # و÷2^30 = ٨٤٪ فقط — أي أن الثنائيّة تُظهر الامتلاء أقلّ من حقيقته.
            dbj=$(curl -s --max-time 30 -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/postgres/$DB_ID")
            disk_auto=$(echo "$dbj" | grep -oE '"diskAutoscalingEnabled":(true|false)' | head -1 | cut -d: -f2)

            # انحراف render.yaml عن الحيّ — الوجه الثاني لنفس العلّة: ترقيةٌ تُجرى على
            # لوحة Render ولا يعلمها الملف. وهنا الضرر أفدح من مؤشّرٍ كاذب: مزامنة
            # Blueprint تلقائيّة (autoSync) على هذا المستودع، فأوّل تعديلٍ يمسّ
            # render.yaml بعد الترقية يدفع Render إلى تطبيق الخطّة **الأدنى** المكتوبة.
            # (الشرطة في الملف وتحتها الشرطة السفليّة في الواجهة: basic-1gb ≡ basic_1gb)
            want_plan=$(awk '/databases:/{d=1} d && /^[[:space:]]*plan:/{print $2; exit}' render.yaml | tr -d '"' | tr '-' '_')
            live_plan=$(echo "$dbj" | grep -oE '"plan":"[a-z0-9_]+"' | head -1 | cut -d'"' -f4)
            if [ -n "$want_plan" ] && [ -n "$live_plan" ] && [ "$want_plan" != "$live_plan" ]; then
              note "render.yaml يعلن خطّة القاعدة $want_plan والحيّة $live_plan — واءم الملف قبل أن تُرجِع مزامنة Blueprint الترقيةَ"
            fi
            if [ -n "$disk" ] && [ -n "$disk_limit" ]; then
              dpct=$(awk -v u="$disk" -v l="$disk_limit" 'BEGIN{printf "%.0f", (u/l)*100}')
              echo "مساحة القاعدة: ${dpct}% من $(gbd "$disk_limit") غيغابايت · التوسيع التلقائي: ${disk_auto:-؟}"
              # ٨٥٪ لا ٩٠٪: Render يوسّع عند ٩٠٪ ولا يوسّع أكثر من مرّة كل ٦ ساعات،
              # فنموٌّ سريع بعد توسيعٍ حديث قد يبلغ الامتلاء قبل أن يُسمح بالتالي.
              [ "$dpct" -ge 85 ] && note "مساحة قاعدة البيانات ${dpct}% من $(gbd "$disk_limit") غيغابايت — تحقّق أن التوسيع التلقائي يعمل"
            else
              note "تعذّر قياس مساحة قاعدة البيانات من Render"
            fi
            # الزيادة التلقائية هي ما يمنع تعليق القاعدة عند الامتلاء — إطفاؤها
            # (يدوياً أو بمزامنة render.yaml) يستحقّ تنبيهاً حتى لو كانت المساحة فارغة
            [ "$disk_auto" = "false" ] && note "التوسيع التلقائي لمساحة قاعدة البيانات مطفأ — القاعدة ستُعلَّق عند امتلائها"

            # ادفع القياس للوحة المالك — يلزمه سقف الذاكرة لأن البطاقة تقسم عليه،
            # ولا يُرسَل سقفٌ مُخمَّن: بطاقةٌ تشيخ وتختفي أصدق من نسبةٍ مبنيّة على وهم
            if [ -n "$OPS_TOKEN" ] && [ -n "$mem_limit" ]; then
              curl -s -o /dev/null --max-time 20 -X POST \
                -H "x-ops-token: $OPS_TOKEN" -H 'Content-Type: application/json' \
                -d "{\"memoryBytes\":${mem:-0},\"memoryLimitBytes\":$mem_limit,\"connections\":${con:-0},\"connectionLimit\":${con_limit:-0},\"diskBytes\":${disk:-0},\"diskLimitBytes\":${disk_limit:-0},\"diskAutoscaling\":${disk_auto:-null}}" \
                https://dsd-backend.onrender.com/api/analytics/infra-metrics || true
            fi
          fi

          # ١) الباكند: حي + نضارة النشر (الكوميت المعلن مقابل HEAD)
          hj=$(curl -s --max-time 30 https://dsd-backend.onrender.com/api/health || echo "")
          if ! echo "$hj" | grep -q '"status":"ok"'; then
            note "الباكند لا يرد على /api/health"
          else
            ver=$(echo "$hj" | grep -oE '"version":"[0-9a-f]+"' | cut -d'"' -f4)
            # المقارنة بآخر كوميت **مسّ backend** لا بـHEAD: render.yaml فيه
            # buildFilter على backend/**، فكوميتٌ يمسّ الواجهة أو الوورك فلو لا
            # يُعيد بناء الخادم عمداً — ومقارنته بـHEAD كانت تُنتج إنذاراً كاذباً
            # مضمون التكرار، وهو الذي أبقى القناة مقفلة ١٧ ساعة.
            back_sha=$(git log -1 --format=%h --abbrev=7 -- backend ':(exclude)backend/**/*.md' 2>/dev/null || echo "")
            if [ -n "$ver" ] && [ -n "$back_sha" ] && [ "$ver" != "$back_sha" ]; then
              # لا إنذار أثناء نشر جار: نتسامح ما دام ذلك الكوميت أحدث من ٣٠ دقيقة
              back_ts=$(git log -1 --format=%ct -- backend ':(exclude)backend/**/*.md' 2>/dev/null || echo 0)
              age=$(( $(date +%s) - back_ts ))
              if [ "$age" -gt 1800 ]; then
                note "الباكند يخدم $ver بينما آخر كوميت مسّ backend هو $back_sha منذ $((age/60)) دقيقة — نشر لم يصل"
              fi
            fi
          fi

          # ٢) دخان الباكند: الحراس أحياء (401 تعني المسار والمصادقة يعملان؛
          #    500 أو timeout تعني انهيارا خلف الباب)
          for p in "finance/snapshot" "tenants" "wa-inbox/stats"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "https://dsd-backend.onrender.com/api/$p")
            [ "$code" = "401" ] || note "دخان: /api/$p رد $code والمتوقع 401"
          done

          # ٣) الموقع العام: يرد ويحمل وسم التطبيق
          body=$(curl -s --max-time 30 https://fieldsa.net/ || echo "")
          echo "$body" | grep -qi '<div id="root"' || note "fieldsa.net لا يعيد صفحة التطبيق"
          # صفحة الدفع العامة (مسار مال حرج)
          pc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://fieldsa.net/pay/health-probe)
          case "$pc" in 200|404) : ;; *) note "صفحة الدفع /pay ردت $pc";; esac

          # ٤) البوت: مهلة ٩٠ث تسمح بإيقاظ الخدمة النائمة
          bj=$(curl -s --max-time 90 https://wa-sales-bot.onrender.com/ || echo "")
          echo "$bj" | grep -q '"ok":true' || note "بوت واتساب لا يرد (حتى بعد مهلة الإيقاظ)"

          {
            echo "fails<<EOF"
            printf "%b" "$fails"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: نبه على تغير الحالة لا على الحالة
        env:
          GH_TOKEN: ${{ github.token }}
          FAILS: ${{ steps.checks.outputs.fails }}
        run: |
          # ذاكرة الحالة هي الـIssue المفتوحة بوسم health-alert. لكن «مفتوحة»
          # وحدها كانت تكفي للصمت، فإنذارٌ واحد — ولو كاذباً — يقفل القناة عن
          # **كل عطل يليه**. الدليل: إنذار بقي مفتوحاً ١٧ ساعة و٣٤ دقيقة.
          #
          # صارت الذاكرة **بصمة مجموعة الأعطال** لا مجرّد وجود الـIssue: ما دامت
          # الأعطال نفسها يصمت المراقب، فإن تغيّرت — عطلٌ جديد ظهر أو قديمٌ زال —
          # علّق على الـIssue فيصل إشعارٌ جديد ولا يضيع العطل الحقيقي خلف الكاذب.
          open=$(gh issue list --label health-alert --state open --json number -q '.[0].number' || echo "")
          stamp=$(TZ=Asia/Riyadh date '+%Y-%m-%d %H:%M')

          if [ -n "$FAILS" ]; then
            fp=$(printf '%b' "$FAILS" | sed '/^[[:space:]]*$/d' | sort -u | sha1sum | cut -c1-12)
            printf '%s' "" > /tmp/body.md
            {
              echo "رصدت نبضة الصحة:"
              echo
              printf '%b' "$FAILS"
              echo
              echo "يغلق هذا الإنذار تلقائياً عند تعافي كل الأهداف."
              echo
              echo "<!-- fp:$fp -->"
            } > /tmp/body.md

            if [ -z "$open" ]; then
              gh issue create --title "🔴 عطل مرصود — $stamp بتوقيت الرياض" --label health-alert --body-file /tmp/body.md
              echo "فتحت إنذاراً جديداً (بصمة $fp)"
            else
              prev=$(gh issue view "$open" --json body -q .body | grep -oE 'fp:[0-9a-f]{12}' | cut -d: -f2 || echo "")
              if [ "$prev" = "$fp" ]; then
                echo "العطل نفسه مستمرّ (بصمة $fp) — لا إشعار مكرّر"
              else
                {
                  echo "🔄 تغيّرت مجموعة الأعطال — $stamp بتوقيت الرياض"
                  echo
                  printf '%b' "$FAILS"
                } > /tmp/comment.md
                gh issue comment "$open" --body-file /tmp/comment.md
                gh issue edit "$open" --body-file /tmp/body.md
                echo "الأعطال تغيّرت من ${prev:-بلا بصمة} إلى $fp — علّقتُ على #$open"
              fi
            fi
            exit 1
          else
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "✅ تعافى كل شيء — $stamp بتوقيت الرياض. تغلق آلياً."
              gh issue close "$open"
              echo "أغلقت الإنذار #$open"
            fi
            echo "كل الأهداف سليمة"
          fi

  triage:
    if: github.event.schedule == '5 5 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: فرز إخفاقات الوورك فلو أمس
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          since=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
          # -R إلزامي: هذه الوظيفة بلا checkout فلا سياق مستودع لـgh — وبدونه
          # كان الفشل يُبتلع بـ|| echo فيُقرأ «لا إخفاقات» وهو أسوأ أعطال
          # المراقب: صمت يبدو نجاحا. الفشل هنا يصرخ ولا يتنكر في هيئة هدوء.
          rows=$(gh run list -R "${{ github.repository }}" --limit 100 \
            --json name,conclusion,createdAt,url \
            -q "[.[] | select(.createdAt > \"$since\" and .conclusion == \"failure\")] | group_by(.name) | map({name: .[0].name, count: length, url: .[0].url}) | .[] | \"• \(.name): \(.count) فشل — \(.url)\"") \
            || { echo "::error::تعذر جلب قائمة التشغيلات — الفرز نفسه معطل"; exit 1; }
          if [ -z "$rows" ]; then
            echo "لا إخفاقات أمس — لا بريد (الصمت هنا نجاح مثبت لا غياب فحص)"
            exit 0
          fi
          # تجميعة واحدة يوميا بدل بريد لكل فشل — الفرز كان يستهلك ٤٥ دقيقة/شهر
          gh issue create -R "${{ github.repository }}" \
            --title "🟡 ملخص إخفاقات الوورك فلو — $(TZ=Asia/Riyadh date '+%Y-%m-%d')" \
            --label ci-triage \
            --body "$(printf 'إخفاقات آخر ٢٤ ساعة مجمعة حسب الوورك فلو:\n\n%s\n\nهذه تجميعة إخبارية تغلق بعد الاطلاع — الإخفاق المتكرر يستحق بطاقة قرار.' "$rows")"