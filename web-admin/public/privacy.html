<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سياسة الخصوصية — FieldSales</title>
  <!--
    نسخة ثابتة قديمة كانت هنا (يونيو 2026) تقول «لا نجمع موقعك الجغرافي» ولا تذكر قياس Google Ads —
    فناقضت السياسة المعتمدة. السياسة لها مصدر واحد الآن: https://fieldsa.net/privacy/
    (web-admin/src/landing/defaultContent*.ts). يبقى هذا الملف تحويلاً فقط لأن روابط خارجية
    (قوائم المتاجر مثلاً) قد تشير إليه. لا تُعِد كتابة نصّ سياسة هنا.
    الوجهة بالشرطة الأخيرة (/privacy/) عمداً: Render لا يخدم الصفحة المصيَّرة مسبقاً
    (dist/privacy/index.html) إلا بها، و/privacy بلا شرطة تبتلعه قاعدة SPA فيصل الزاحف ومن
    يتبع التحويل بلا JavaScript إلى قوقعة الرئيسية بلا نصّ السياسة (انظر scripts/prerender.mjs).
  -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://fieldsa.net/privacy/" />
  <meta http-equiv="refresh" content="0; url=/privacy/" />
  <script>location.replace('/privacy/' + location.hash);</script>
  <style>
    body { font-family: system-ui, sans-serif; background: #FAF7F0; color: #1F1A13; text-align: center; padding: 48px 16px; line-height: 1.8; }
    a { color: #E15A30; }
  </style>
</head>
<body>
  <p>انتقلت سياسة الخصوصية إلى <a href="/privacy/">fieldsa.net/privacy</a></p>
  <p lang="en" dir="ltr">Our privacy policy has moved to <a href="/en/privacy/">fieldsa.net/en/privacy</a></p>
</body>
</html>
