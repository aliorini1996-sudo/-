    <script>
      (function () {
        var p = location.pathname;
        if (p !== '/m' && p.indexOf('/m/') !== 0) return;
        var m = document.querySelector('link[rel="manifest"]');
        if (m) m.href = '/manifest-admin.webmanifest';
        var t = document.querySelector('link[rel="apple-touch-icon"]');
        if (t) t.href = '/icons/admin-apple-touch.png';
        var title = document.querySelector('meta[name="apple-mobile-web-app-title"]');
        if (title) title.content = 'إدارة';
        var theme = document.querySelector('meta[name="theme-color"]');
        if (theme) theme.content = '#1F1A13';

    <!-- المحتوى المُصيَّر وشاشة الإقلاع (E2 وتصحيح الناقد 1):
         - prerender.mjs يكتب على كل صفحة مُصيَّرة <html data-ssr-path="/مسارها/">، والسكربت التالي يضيف
           الفئة ssr على <html> **فقط** إن طابق location.pathname هذا المسار (بعد فكّ الترميز وتوحيد الشرطة
           الأخيرة) — فيظهر المحتوى من أول رسم بدل انتظار الحزمة، وتُخفى شاشة الإقلاع.
         - هذا الملف نفسه قوقعة كل مسار غير مُصيَّر (/m و/rep و/login و/c و/pay و/platform…) ومساره «/»:
           هناك لا تطابق، فيبقى المحتوى مخفياً وتبقى شاشة الإقلاع — لا نصّ تسويقياً على التطبيق.
         - بلا JavaScript (زواحف الذكاء الاصطناعي) يظهر المحتوى بقاعدة noscript. -->
    <script>
      (function () {
        var d = document.documentElement;
        var want = d.getAttribute('data-ssr-path');
        if (!want) return;
        var norm = function (p) {
          try { p = decodeURIComponent(p); } catch (e) { /* ترميز سيّئ: يُقارَن كما هو */ }
          return p.charAt(p.length - 1) === '/' ? p : p + '/';
        };
        if (norm(location.pathname) === norm(want)) d.className += (d.className ? ' ' : '') + 'ssr';
      })();
    </script>
    <style>

      [data-ssr],[data-ssr-hold]{max-width:820px;margin:0 auto;padding:28px 18px 56px;font-family:'Noto Kufi Arabic','IBM Plex Sans',system-ui,sans-serif;font-size:16px;line-height:1.85;color:#1F1A13;background:#FAF7F0}

      [data-ssr] p,[data-ssr] ul,[data-ssr] ol,[data-ssr] table,[data-ssr-hold] p,[data-ssr-hold] ul,[data-ssr-hold] ol,[data-ssr-hold] table{margin:10px 0}
      [data-ssr] ul,[data-ssr] ol,[data-ssr-hold] ul,[data-ssr-hold] ol{padding-inline-start:22px;list-style:disc}
      [data-ssr] a,[data-ssr-hold] a{color:#C94E28;text-decoration:underline}
      [data-ssr] img,[data-ssr-hold] img{max-width:100%;height:auto;border-radius:14px}
      [data-ssr] table,[data-ssr-hold] table{border-collapse:collapse;width:100%}
      [data-ssr] th,[data-ssr] td,[data-ssr-hold] th,[data-ssr-hold] td{border:1px solid #E9E1D3;padding:8px;text-align:start}
      #boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#FAF7F0;transition:opacity .35s ease}
      #boot.hide{opacity:0;pointer-events:none}
      #boot .spin{width:24px;height:24px;border:3px solid #E9E1D3;border-top-color:#E15A30;border-radius:50%;animation:bootspin .7s linear infinite}
      @keyframes bootspin{to{transform:rotate(360deg)}}
    </style>
    <noscript><style>#root [data-ssr]{display:block!important}#boot{display:none!important}</style></noscript>
    <script>
      /* توحيد الشرطة الأخيرة — بديل عمليّ عن 301 على الحافة.
         الصفحات مُصيَّرة كمجلّدات (blog/x/index.html)؛ والطلب بلا شرطة لا يجد ملفاً فتبتلعه
         قاعدة `/* → /index.html` فتُخدَم هذه القوقعة (canonical فيها = الرئيسية) — أي أننا
         نُخبر جوجل أن الصفحة نسخة مكرّرة من الرئيسية. ولا يمكن إصلاحه على الحافة: DNS في dnet
         وCloudflare الظاهر أمام الموقع هو Cloudflare الخاص بـRender لا حسابنا (قِيس 29 يوليو 2026).
         الحلّ هنا: توجيه فوري قبل إقلاع React (جوجل ينفّذ JS ويتبع هذا التوجيه).
         شرطا الأمان: لا نقطة في المسار (استثناء الملفات) وعدم انتهائه بشرطة ⇒ لا حلقة ممكنة. */
      (function () {
        var p = location.pathname;
        if (p.length > 1 && p.charAt(p.length - 1) !== '/' && p.indexOf('.') === -1) {
          location.replace(p + '/' + location.search + location.hash);
        }
      })();
    </script>
