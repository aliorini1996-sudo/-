# خط بناء iOS على Codemagic — تطبيق المندوب (FieldSales)
# يبني على macOS، يوقّع بمفتاح App Store Connect، ويرفع إلى TestFlight.
# جذر المستودع = مجلّد ios-app هذا. راجع CODEMAGIC-SETUP.md لخطوات الربط.

workflows:
  ios-appstore:
    name: FieldSales iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # الاسم يجب أن يطابق حرفياً تكامل App Store Connect API key المُضاف في Codemagic.
      app_store_connect: FieldSales ASC Key
    environment:
      # مجموعة متغيّرات Codemagic التي تحوي CERTIFICATE_PRIVATE_KEY (سرّي).
      groups:
        - ios_signing
      # لا نستخدم كتلة ios_signing: تجلب ملف تعريف موجوداً وتُفشل التحضير قبل تشغيل السكربتات.
      vars:
        XCODE_WORKSPACE: "FieldSales.xcworkspace"
        XCODE_SCHEME: "FieldSales"
        BUNDLE_ID: "net.fieldsa.rep"
      xcode: latest
      cocoapods: default
    scripts:
      - name: تهيئة سلسلة المفاتيح
        script: |
          keychain initialize

      - name: جلب شهادة وملف تعريف التوزيع
        script: |
          # مفتاح خاص دائم إلزامي. بدونه يولّد كل بناء مفتاحاً جديداً فتُنشأ شهادة توزيع
          # جديدة، وآبل تسمح بشهادتين فقط ⇒ يفشل البناء بـ409. شهادة واحدة مرتبطة بهذا
          # المفتاح تكفي لكل تطبيقات الحساب (ملف التعريف هو ما يخصّ كل تطبيق على حدة).
          # المفتاح يُحفظ في Codemagic → Settings → Global variables and secrets (Secure).
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "✗ CERTIFICATE_PRIVATE_KEY غير مضبوط — أضِفه في Codemagic كمتغيّر سرّي."
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create

      - name: إضافة الشهادات لسلسلة المفاتيح
        script: |
          keychain add-certificates

      - name: تثبيت اعتماديات CocoaPods
        script: |
          pod install

      - name: تطبيق ملفات التوقيع على المشروع
        script: |
          xcode-project use-profiles

      - name: ضبط رقم البناء تلقائياً (فريد متصاعد)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "FieldSales/Info.plist"

      - name: بناء الـIPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # يرفع البناء إلى TestFlight فقط. الإرسال للمراجعة يدوي.
        submit_to_testflight: true
      email:
        recipients:
          - aliorini1996@gmail.com
        notify:
          success: true
          failure: true
