# خط بناء iOS على Codemagic — تطبيق المندوب (FieldSales)
# يبني على macOS، يوقّع بمفتاح App Store Connect، ويرفع إلى TestFlight.
# جذر المستودع = مجلّد ios-app هذا. راجع CODEMAGIC-SETUP.md لخطوات الربط.

workflows:
  ios-appstore:
    name: FieldSales iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # الاسم يجب أن يطابق حرفياً تكامل App Store Connect API key المُضاف في Codemagic.
      app_store_connect: FieldSales ASC Key
    environment:
      # مجموعة متغيّرات Codemagic التي تحوي CERTIFICATE_PRIVATE_KEY (سرّي).
      groups:
        - ios_signing
      # لا نستخدم كتلة ios_signing: تجلب ملف تعريف موجوداً وتُفشل التحضير قبل تشغيل السكربتات.
      vars:
        XCODE_WORKSPACE: "FieldSales.xcworkspace"
        XCODE_SCHEME: "FieldSales"
        BUNDLE_ID: "net.fieldsa.rep"
      xcode: latest
      cocoapods: default
    scripts:
      # أولاً وقبل أي توقيع أو بناء: فكّ حمولة الطباعة في Swift يطابق الويب وأندرويد بايتاً ببايت
      # (المتجهات الذهبية الـ42)، وحرّاس الإصدار. أي فشل هنا يوقف البناء قبل TestFlight.
      - name: فحص عقد الطباعة (متجهات ذهبية) وحراس الإصدار
        script: |
          set -euo pipefail
          echo "afa7cbd5a15dd7383565b1efb86e43074114c5ab0bf5cd8ffb3afd09259d03ef  ci/print_payload_vectors.json" | shasum -a 256 -c -
          xcrun --sdk macosx swiftc -O -o /tmp/fsp-check FieldSales/PrintPayload.swift ci/fsp-check/main.swift
          /tmp/fsp-check ci/print_payload_vectors.json
          plutil -lint FieldSales/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSBluetoothAlwaysUsageDescription" FieldSales/Info.plist
          if /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes" FieldSales/Info.plist | grep -qi bluetooth; then echo "✗ وضع خلفية للبلوتوث"; exit 1; fi
          if grep -q CODE_SIGN_ENTITLEMENTS FieldSales.xcodeproj/project.pbxproj; then echo "✗ Entitlements"; exit 1; fi
          if grep -RniE "nearpay|near pay|نيرباي|نير باي" FieldSales; then echo "✗ اسم المزوّد"; exit 1; fi
          # لا Privacy Manifest في التطبيق: أي واجهة «سبب مطلوب» في كوده يرفضها App Store Connect (ITMS-91053)
          if grep -RnE --include='*.swift' "UserDefaults|systemUptime|mach_absolute_time|creationDate|modificationDate|ModificationDate|volumeAvailableCapacity|systemFreeSize|activeInputModes" FieldSales; then echo "✗ واجهة تتطلب Privacy Manifest"; exit 1; fi
          # الإصدار في الإعدادين (Debug وRelease) كلاهما 1.1.0
          test "$(grep -c 'MARKETING_VERSION = ' FieldSales.xcodeproj/project.pbxproj)" -eq "$(grep -c 'MARKETING_VERSION = 1.1.0;' FieldSales.xcodeproj/project.pbxproj)"
          grep -q "MARKETING_VERSION = 1.1.0;" FieldSales.xcodeproj/project.pbxproj

      - name: تهيئة سلسلة المفاتيح
        script: |
          keychain initialize

      - name: جلب شهادة وملف تعريف التوزيع
        script: |
          # مفتاح خاص دائم إلزامي. بدونه يولّد كل بناء مفتاحاً جديداً فتُنشأ شهادة توزيع
          # جديدة، وآبل تسمح بشهادتين فقط ⇒ يفشل البناء بـ409. شهادة واحدة مرتبطة بهذا
          # المفتاح تكفي لكل تطبيقات الحساب (ملف التعريف هو ما يخصّ كل تطبيق على حدة).
          # المفتاح يُحفظ في Codemagic → Settings → Global variables and secrets (Secure).
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "✗ CERTIFICATE_PRIVATE_KEY غير مضبوط — أضِفه في Codemagic كمتغيّر سرّي."
            exit 1
          fi
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --certificate-key=@env:CERTIFICATE_PRIVATE_KEY --create

      - name: إضافة الشهادات لسلسلة المفاتيح
        script: |
          keychain add-certificates

      - name: تثبيت اعتماديات CocoaPods
        script: |
          pod install

      - name: تطبيق ملفات التوقيع على المشروع
        script: |
          xcode-project use-profiles

      - name: ضبط رقم البناء تلقائياً (فريد متصاعد)
        script: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "FieldSales/Info.plist"

      - name: بناء الـIPA
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # يرفع البناء إلى TestFlight فقط. الإرسال للمراجعة يدوي.
        submit_to_testflight: true
      email:
        recipients:
          - aliorini1996@gmail.com
        notify:
          success: true
          failure: true
